name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Verify (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      GRAVITYBOX_CI_HEADLESS: '1'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Development Environment
        run: npm run doctor

      - name: Setup Pinned Test Browser
        run: node tools/setup-test-browser.mjs

      - name: Run Full Release Gate (Build, Unit, Browser, Swift & i18n Gate)
        env:
          CI: 'true'
          GRAVITYBOX_CI_HEADLESS: '1'
        run: node tools/verify.mjs --no-vendor

      - name: Preserve Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-${{ github.run_id }}
          path: 质检报告/
          retention-days: 7
