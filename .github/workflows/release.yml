name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签（如 v1.0.1）；仅构建草稿，不公开发布'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-draft:
    name: Verify & Prepare Draft DMG
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate Tag Format
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '需要 vX.Y.Z 正式版本标签' >&2; exit 1; }

      - name: Checkout Tagged Code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check Version, Commit & Existing Release
        run: node tools/release-control.mjs preflight

      - name: Install Dependencies
        run: npm ci

      - name: Check Development Environment
        run: npm run doctor

      - name: Setup Pinned Test Browser
        run: node tools/setup-test-browser.mjs

      - name: Verify & Package DMG
        run: |
          node tools/verify.mjs --no-vendor
          node tools/package-mac.mjs
          node tools/release-control.mjs manifest

      - name: Create Draft Without Replacing Assets
        shell: bash
        run: |
          node tools/release-control.mjs preflight
          DMG="成品/GravityBox-${RELEASE_TAG#v}-arm64.dmg"
          gh release create "$RELEASE_TAG" "$DMG" "$DMG.sha256" 成品/release-manifest.json \
            --draft --verify-tag --title "GravityBox $RELEASE_TAG" --generate-notes
          echo '草稿已生成。下载并验收此 DMG 后，通过 Publish Accepted Release 手动发布；不要重新构建。' >> "$GITHUB_STEP_SUMMARY"
          cat "$DMG.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          path: 质检报告/
          retention-days: 7
